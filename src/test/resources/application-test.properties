# Tests sans PostgreSQL : H2 en memoire, en mode PostgreSQL.
# Flyway reste actif pour que les migrations soient executees et verifiees par validate.
spring.datasource.url=jdbc:h2:mem:smartcampus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
