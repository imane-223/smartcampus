spring.application.name=smartcampus
server.port=${SERVER_PORT:8081}

# Base de donnees : valeurs par defaut pour le developpement local (compose.yaml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartcampus}
spring.datasource.username=${DB_USER:smartcampus}
spring.datasource.password=${DB_PASSWORD:smartcampus}

# Le schema est gere par Flyway (src/main/resources/db/migration), Hibernate ne fait que verifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# L'authentification est faite par AuthService : pas d'utilisateur en memoire genere par Boot
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
